<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub PR Analytics</title>
<style>
:root{
  --bg:#0b0f14;--panel:#111821;--panel2:#151e29;--border:#263241;
  --text:#eef4fb;--muted:#8c9aaa;--blue:#58a6ff;--green:#3fb950;
  --red:#f85149;--yellow:#d29922;--purple:#bc8cff;--cyan:#39c5cf;
  --shadow:0 14px 40px rgba(0,0,0,.22)
}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#132033 0,#0b0f14 38%);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1380px;margin:auto;padding:34px 22px 70px}
.hero{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:25px}
h1{font-size:38px;line-height:1;margin:0 0 10px;letter-spacing:-1.5px}.sub{color:var(--muted);max-width:720px;line-height:1.6}
.search{display:flex;gap:10px;margin:25px 0 20px}.search input{flex:1;min-width:0}
input,select{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:12px 14px;border-radius:9px;font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(88,166,255,.12)}
button{border:0;border-radius:9px;background:var(--blue);color:#06101c;font-weight:800;padding:0 22px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.error{background:#351719;border:1px solid #7d252b;color:#ffb4b0;padding:12px 14px;border-radius:9px;margin:12px 0}
.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.kpi{font-size:27px;font-weight:850;letter-spacing:-.7px}.kpi small{font-size:13px;color:var(--muted);font-weight:600}.label{color:var(--muted);margin-top:5px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.wide{grid-column:1/-1}
.card h2{font-size:16px;margin:0 0 16px}.chart{height:255px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px}.bar{fill:var(--blue);opacity:.78}.bar:hover{opacity:1}
.donutWrap{display:flex;align-items:center;justify-content:center;gap:35px;min-height:255px}.donut{width:210px;height:210px;border-radius:50%;position:relative;background:conic-gradient(var(--green) 0 var(--m),var(--red) var(--m) var(--c),var(--yellow) var(--c) 100%)}
.donut:after{content:"";position:absolute;inset:52px;border-radius:50%;background:var(--panel)}
.center{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;flex-direction:column}.center strong{font-size:31px}.center span{color:var(--muted);font-size:11px}
.legend{display:grid;gap:11px;min-width:180px}.legendRow{display:flex;justify-content:space-between;gap:18px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px}
.repoList{display:grid;gap:10px}.repo{display:grid;grid-template-columns:minmax(150px,1fr) 120px 55px;gap:12px;align-items:center}.track{height:7px;background:#222d3a;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:20px}
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.filters input{max-width:350px}.tableWrap{overflow:auto;max-height:650px}
table{width:100%;border-collapse:collapse;min-width:980px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--panel2)}
.title{font-weight:650;max-width:480px}.repoName{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-flex;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.merged{background:#12351e;color:#5ee275}.closed{background:#42181b;color:#ff817b}.open{background:#3d2e0c;color:#e5b84b}
.num{color:var(--muted);font-size:12px}.small{font-size:12px;color:var(--muted)}.loading{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.hero{display:block}h1{font-size:31px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}.search button{height:45px}.donutWrap{flex-direction:column;gap:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>GitHub PR Analytics</h1>
      <div class="sub">An overview of a developer’s Pull Request activity: merge rate, evolution over time, most active repositories, size of changes, and details of each PR.</div>
    </div>
  </div>

  <form class="search" id="form">
    <input id="username" placeholder="Nom d'utilisateur GitHub — ex. octocat" autocomplete="off" required>
    <button id="go">Analyze</button>
  </form>
  <div id="error" class="hidden"></div>
  <div id="app"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function api(path){
  const r=await fetch('https://api.github.com'+path,{headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok){let m='Erreur GitHub '+r.status;try{m+=' — '+(await r.json()).message}catch{}throw Error(m)}
  return r.json();
}

async function searchPRs(user){
  const out=[];
  for(let page=1;page<=10;page++){
    const q=encodeURIComponent(`author:${user} type:pr`);
    const d=await api(`/search/issues?q=${q}&per_page=100&page=${page}&sort=created&order=desc`);
    out.push(...d.items);
    if(d.items.length<100 || out.length>=Math.min(d.total_count,1000))break;
  }
  return out;
}

async function enrich(items){
  const out=[];
  for(let i=0;i<items.length;i+=8){
    const batch=items.slice(i,i+8);
    const vals=await Promise.all(batch.map(async p=>{
      try{
        const repo=p.repository_url.split('/repos/')[1], d=await api(`/repos/${repo}/pulls/${p.number}`);
        return {...p,repo,merged:!!d.merged_at,merged_at:d.merged_at,additions:d.additions||0,deletions:d.deletions||0,
          changed_files:d.changed_files||0,commits:d.commits||0,reviews:d.review_comments||0};
      }catch{return {...p,repo:p.repository_url.split('/repos/')[1]||'',merged:false,additions:0,deletions:0,changed_files:0,commits:0,reviews:0}}
    }));
    out.push(...vals);
  }
  return out;
}

function fmtDate(x){return new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium'}).format(new Date(x))}
function monthKey(x){const d=new Date(x);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function monthLabel(k){const [y,m]=k.split('-');return new Intl.DateTimeFormat('fr-FR',{month:'short',year:'2-digit'}).format(new Date(+y,+m-1,1))}
function escAttr(s){return esc(s).replace(/`/g,'&#96;')}

function lineChart(data){
  if(!data.length)return '<div class="loading">Pas assez de données.</div>';
  const W=760,H=235,L=40,R=12,T=10,B=35,max=Math.max(...data.map(x=>x.v),1);
  const pts=data.map((x,i)=>{const px=L+(W-L-R)*(i/Math.max(data.length-1,1));const py=T+(H-T-B)*(1-x.v/max);return [px,py,x]});
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}">
    <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#263241"/>
    <line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#263241"/>
    <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="3"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--blue)"><title>${esc(monthLabel(p[2].m))}: ${p[2].v} PR</title></circle>`).join('')}
    ${pts.filter((_,i)=>i===0||i===pts.length-1||i%Math.ceil(pts.length/6)===0).map(p=>`<text x="${p[0]}" y="${H-10}" text-anchor="middle">${esc(monthLabel(p[2].m))}</text>`).join('')}
  </svg>`;
}

function repoBars(map){
  const arr=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8), max=Math.max(...arr.map(x=>x[1]),1);
  return `<div class="repoList">${arr.map(([r,n])=>`<div class="repo"><a href="https://github.com/${escAttr(r)}" target="_blank" rel="noopener">${esc(r)}</a><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div><b>${n}</b></div>`).join('')}</div>`;
}

function render(prs,user){
  const total=prs.length, merged=prs.filter(p=>p.merged).length, closed=prs.filter(p=>!p.merged&&p.state==='closed').length, open=prs.filter(p=>p.state==='open').length;
  const mergeRate=total?merged/total*100:0;
  const mergedPlusClosed=total?((merged+closed)/total*100):0;
  const avgChanges=total?Math.round(prs.reduce((s,p)=>s+p.additions+p.deletions,0)/total):0;
  const mergedTimes=prs.filter(p=>p.merged_at).map(p=>new Date(p.merged_at)-new Date(p.created_at)).filter(x=>x>=0);
  const avgMergeDays=mergedTimes.length?(mergedTimes.reduce((a,b)=>a+b,0)/mergedTimes.length/86400000).toFixed(1):'—';

  const byMonth={};prs.forEach(p=>{const m=monthKey(p.created_at);byMonth[m]=(byMonth[m]||0)+1});
  const months=Object.keys(byMonth).sort().slice(-12).map(m=>({m,v:byMonth[m]}));
  const repos={};prs.forEach(p=>repos[p.repo]=(repos[p.repo]||0)+1);

  $('app').innerHTML=`
  <div class="stats">
    <div class="card"><div class="kpi">${total}</div><div class="label">Pull requests</div></div>
    <div class="card"><div class="kpi">${mergeRate.toFixed(1)}%</div><div class="label">Merge rate</div></div>
    <div class="card"><div class="kpi">${open}</div><div class="label">Still opened</div></div>
    <div class="card"><div class="kpi">${closed}</div><div class="label">Closed without merge</div></div>
    <div class="card"><div class="kpi">${avgMergeDays}<small>${avgMergeDays==='—'?'':' j'}</small></div><div class="label">Average duration before merge</div></div>
    <div class="card"><div class="kpi">${avgChanges}<small> lignes</small></div><div class="label">Average changes / PR</div></div>
  </div>

  <div class="grid">
    <section class="card">
      <h2>Issue des Pull Requests</h2>
      <div class="donutWrap">
        <div class="donut" style="--m:${mergeRate}%;--c:${mergedPlusClosed}%">
          <div class="center"><strong>${total}</strong><span>PR analysées</span></div>
        </div>
        <div class="legend">
          <div class="legendRow"><span><i class="dot" style="background:var(--green)"></i>Merged</span><b>${merged} · ${mergeRate.toFixed(1)}%</b></div>
          <div class="legendRow"><span><i class="dot" style="background:var(--red)"></i>Closed</span><b>${closed} · ${total?(closed/total*100).toFixed(1):0}%</b></div>
          <div class="legendRow"><span><i class="dot" style="background:var(--yellow)"></i>Opened</span><b>${open} · ${total?(open/total*100).toFixed(1):0}%</b></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>PR Created by me.</h2>
      <div class="chart">${lineChart(months)}</div>
    </section>

    <section class="card">
      <h2>Most active repositories</h2>
      ${repoBars(repos)}
    </section>

    <section class="card">
      <h2>Some data</h2>
      <div class="stats" style="grid-template-columns:1fr 1fr;margin:0">
        <div><div class="kpi">${prs.reduce((s,p)=>s+p.additions,0).toLocaleString('fr-FR')}</div><div class="label">Added</div></div>
        <div><div class="kpi">${prs.reduce((s,p)=>s+p.deletions,0).toLocaleString('fr-FR')}</div><div class="label">Deleted</div></div>
        <div><div class="kpi">${prs.reduce((s,p)=>s+p.commits,0).toLocaleString('fr-FR')}</div><div class="label">Commits in PR</div></div>
        <div><div class="kpi">${new Set(prs.map(p=>p.repo)).size}</div><div class="label">Repositories</div></div>
      </div>
    </section>

    <section class="card wide">
      <h2>Pull Requests by ${esc(user)}</h2>
      <div class="filters">
        <input id="filter" placeholder="Filtrer par titre ou repository…">
        <select id="state"><option value="all">All states</option><option value="merged">Merged</option><option value="closed">Closed</option><option value="open">Open</option></select>
      </div>
      <div class="tableWrap"><table><thead><tr><th>Pull Request</th><th>État</th><th>Created</th><th>Merge</th><th>Changes</th><th>Commits</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </div>`;
  const fill=()=>{
    const q=$('filter').value.toLowerCase(), st=$('state').value;
    const list=prs.filter(p=>(!q||(p.title+' '+p.repo).toLowerCase().includes(q))&&(st==='all'||(st==='merged'?p.merged:p.state===st&&!p.merged)));
    $('rows').innerHTML=list.map(p=>{
      const cls=p.merged?'merged':p.state==='open'?'open':'closed', label=p.merged?'Mergée':p.state==='open'?'Open':'Closed';
      return `<tr>
        <td><div class="title"><a href="${escAttr(p.html_url)}" target="_blank" rel="noopener">#${p.number} — ${esc(p.title)}</a></div><div class="repoName">${esc(p.repo)}</div></td>
        <td><span class="badge ${cls}">${label}</span></td><td>${fmtDate(p.created_at)}</td>
        <td>${p.merged_at?fmtDate(p.merged_at):'—'}</td>
        <td><span style="color:var(--green)">+${p.additions}</span> / <span style="color:var(--red)">-${p.deletions}</span><br><span class="small">${p.changed_files} files</span></td>
        <td>${p.commits}</td>
      </tr>`}).join('')||'<tr><td colspan="6" class="loading">No results.</td></tr>';
  };
  $('filter').oninput=fill;$('state').onchange=fill;fill();
}

$('form').onsubmit=async e=>{
  e.preventDefault();const user=$('username').value.trim();if(!user)return;
  $('error').classList.add('hidden');$('go').disabled=true;
  $('app').innerHTML='<div class="card loading">Searching Pull Requests…</div>';
  try{const found=await searchPRs(user);$('app').innerHTML='<div class="card loading">Analysis of pull requests and retrieval of statistics</div>';const prs=await enrich(found);render(prs,user)}
  catch(err){$('error').textContent=err.message;$('error').classList.remove('hidden');$('app').innerHTML=''}
  finally{$('go').disabled=false}
};
</script>
</body>
</html>
